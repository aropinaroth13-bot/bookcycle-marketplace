services:
  - type: web
    name: bookcycle-marketplace
    env: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn bookcycle.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: bookcycle-marketplace.onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: bookcycle.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookcycle-db
          property: connectionString


databases:
  - name: bookcycle-db
    databaseName: bookcycle
    user: bookcycle_user
    region: singapore
    plan: free

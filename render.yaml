services:
  - type: web
    name: bookcycle-marketplace
    env: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn bookcycle.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: bookcycle-marketplace.onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: bookcycle.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookcycle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bookcycle-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: redis
    name: bookcycle-redis
    region: singapore
    plan: free

databases:
  - name: bookcycle-db
    databaseName: bookcycle
    user: bookcycle_user
    region: singapore
    plan: free
